[project]
name = "attest-server"
version = "0.1.0"
description = "Tamper-evident, attestable keystroke-provenance ledger (HackMIT 2026)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["attest*", "classroom*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
